name: Setup Python
description: Checkout the repository, set up Python and install Python dependencies

inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.12'
  cache:
    description: Enable pip dependency caching (set to 'pip' to enable)
    required: false
    default: ''
  submodules:
    description: Checkout git submodules
    required: false
    default: 'false'
  install-command:
    description: Command used to install Python dependencies
    required: false
    default: 'pip install -e ".[dev]"'

runs:
  using: composite
  steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.submodules }}

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        ${{ inputs.install-command }}
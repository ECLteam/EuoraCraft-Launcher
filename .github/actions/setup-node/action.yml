name: Setup Node
description: Set up Node.js and pnpm, checkout the repository and install frontend dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22'
  submodules:
    description: Checkout git submodules
    required: false
    default: 'false'
  working-directory:
    description: Directory containing package.json (relative to repository root)
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.submodules }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: ./.github/actions/setup-node
        with:
          submodules: 'true'
          working-directory: 'frontend'

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # build backend with matrix
  build-backend:
    name: Build Backend
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip
          submodules: 'true'
          install-command: 'pip install -e ".[dev]" && pip install pyinstaller'

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install system dependencies for Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Inject MICROSOFT_CLIENT_ID
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os, re
          path = "ECL/common/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ["CLIENT_ID"]
          text = re.sub(r'MICROSOFT_CLIENT_ID\s*=\s*"[^"]*"', f'MICROSOFT_CLIENT_ID = "{cid}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info
        # 版本单一来源为 pyproject.toml 的 [tool.euoracraft] 字段（version / version_type），
        # ECL/common/version.py 运行时从该文件读取，无需再注入 Python 源码。
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import tomlkit

          ref = os.environ.get("REF_NAME", "")
          path = Path("pyproject.toml")
          doc = tomlkit.parse(path.read_text(encoding="utf-8"))
          euoracraft = doc["tool"]["euoracraft"]

          if not ref.startswith("v"):
              print("No tag detected, keeping existing version")
              raise SystemExit(0)

          ver = ref[1:]
          if "-beta" in ver:
              vtype = "beta"
          elif "-alpha" in ver:
              vtype = "alpha"
          else:
              vtype = "release"
          clean = ver.split("-", 1)[0]

          euoracraft["version"] = clean
          euoracraft["version_type"] = vtype
          path.write_text(tomlkit.dumps(doc), encoding="utf-8")
          print(f"Injected version={clean}, version_type={vtype}")
          PY

      - name: Build with PyInstaller
        # 临时禁用 UPX，验证 exe 运行失败是否为 UPX 压缩 python DLL 所致
        env:
          ECL_UPX: "0"
        run: pyinstaller EuoraCraft-Launcher.spec

      - name: Package artifact for Unix
        if: ${{ runner.os != 'Windows'}}
        run: |
          cd dist
          7z a -tzip -mx=9 -mmt=on "../EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip" "EuoraCraft Launcher"

      - name: Package artifact for Windows
        if: ${{runner.os == 'Windows'}}
        run: |
          cd dist
          7z a -tzip -mx=9 -mmt=on "../EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip" "EuoraCraft Launcher.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip
          archive: false

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

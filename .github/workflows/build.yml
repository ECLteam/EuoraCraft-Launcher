name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # build backend with matrix
  build-backend:
    name: Build Backend
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os, re
          path = "ECL/common/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'MICROSOFT_CLIENT_ID\s*=\s*"[^"]*"', f'MICROSOFT_CLIENT_ID = "{cid}"', text)
          text = re.sub(r'CURSEFORGE_API_KEY\s*=\s*"[^"]*"', f'CURSEFORGE_API_KEY = "{cfk}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Parse version from tag
        id: version_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # Strip v prefix, then extract version and type
          if [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
            # Determine version type from suffix
            if [[ "$VER" == *-beta* ]]; then
              echo "type=beta" >> "$GITHUB_OUTPUT"
            elif [[ "$VER" == *-alpha* ]]; then
              echo "type=alpha" >> "$GITHUB_OUTPUT"
            else
              echo "type=release" >> "$GITHUB_OUTPUT"
            fi
            # Strip pre-release suffix for the semver version
            CLEAN_VER="${VER%-*}"
            if [ "$CLEAN_VER" = "$VER" ]; then
              # No suffix, use as-is
              echo "version=$VER" >> "$GITHUB_OUTPUT"
            else
              echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "type=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ steps.version_info.outputs.type }}
          VVER: ${{ steps.version_info.outputs.version }}
        run: |
          python - <<'PY'
          import os, re
          vtype = os.environ.get("VTYPE", "")
          vver = os.environ.get("VVER", "")
          if vtype and vver:
              path = "ECL/common/version.py"
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              # Update __version__
              text = re.sub(
                  r"""__version__\s*=\s*['"][^'"]*['"]""",
                  f'__version__ = "{vver}"',
                  text,
              )
              # Update __version_type__
              text = re.sub(
                  r"""__version_type__\s*=\s*['"][^'"]*['"]""",
                  f'__version_type__ = "{vtype}"',
                  text,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"Injected version={vver}, version_type={vtype}")
          else:
              print("No tag detected, keeping existing version.py")
          PY

      - name: Build with PyInstaller
        # 临时禁用 UPX，验证 exe 运行失败是否为 UPX 压缩 python DLL 所致
        env:
          ECL_UPX: "0"
        run: pyinstaller EuoraCraft-Launcher.spec

      - name: Package artifact for Unix
        if: ${{ runner.os != 'Windows'}}
        run: |
          cd dist
          7z a -tzip -mx=9 -mmt=on "../EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip" "EuoraCraft Launcher"

      - name: Package artifact for Windows
        if: ${{runner.os == 'Windows'}}
        run: |
          cd dist
          7z a -tzip -mx=9 -mmt=on "../EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip" "EuoraCraft Launcher.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip
          path: EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip
          archive: false

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Arch Linux 打包：GitHub 无原生 Arch hosted runner，因此在 Arch 容器中
  # 原生构建 PyInstaller 产物，避免将 Ubuntu/WebKitGTK 的编译期路径带入 Arch 包。
  build-arch-pkg:
    name: Build Arch Linux package
    # 等待后端矩阵仅为确保 tag Release 已创建；Arch job 不下载或复用其 Linux 二进制。
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG=""
          VTYPE=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          fi
          VER="0.0.0"
          if [ -n "$TAG" ]; then
            VER="${TAG#v}"
            if [[ "$VER" == *-beta* ]]; then
              VTYPE="beta"
            elif [[ "$VER" == *-alpha* ]]; then
              VTYPE="alpha"
            else
              VTYPE="release"
            fi
            CLEAN="${VER%-*}"
            [ "$CLEAN" != "$VER" ] && VER="$CLEAN"
          fi
          echo "tagname=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$VER" >> "$GITHUB_OUTPUT"
          echo "version_type=$VTYPE" >> "$GITHUB_OUTPUT"

      - name: Install build toolchain
        run: |
          pacman -Syu --noconfirm \
            python python-pip python-setuptools python-wheel \
            gtk3 webkit2gtk-4.1 librsvg libayatana-appindicator \
            xorg-server-xvfb xorg-xauth dbus \
            patchelf zip curl github-cli

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m venv .venv-arch
          .venv-arch/bin/python -m pip install --upgrade pip
          .venv-arch/bin/python -m pip install -e ".[dev]"

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          path = "ECL/common/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'MICROSOFT_CLIENT_ID\s*=\s*"[^"]*"', f'MICROSOFT_CLIENT_ID = "{cid}"', text)
          text = re.sub(r'CURSEFORGE_API_KEY\s*=\s*"[^"]*"', f'CURSEFORGE_API_KEY = "{cfk}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ steps.ver.outputs.version_type }}
          VVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          vtype = os.environ.get("VTYPE", "")
          vver = os.environ.get("VVER", "")
          if vtype and vver != "0.0.0":
              path = "ECL/common/version.py"
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(
                  r'''__version__\s*=\s*['"][^'"]*['"]''',
                  f'__version__ = "{vver}"',
                  text,
              )
              text = re.sub(
                  r'''__version_type__\s*=\s*['"][^'"]*['"]''',
                  f'__version_type__ = "{vtype}"',
                  text,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"Injected version={vver}, version_type={vtype}")
          else:
              print("No tag detected, keeping existing version.py")
          PY

      - name: Build Arch binary with PyInstaller
        env:
          ECL_UPX: "0"
        run: .venv-arch/bin/pyinstaller EuoraCraft-Launcher.spec

      - name: Smoke test Arch binary
        shell: bash
        run: |
          set +e
          timeout 30s dbus-run-session -- \
            xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            './dist/EuoraCraft Launcher' > arch-smoke.log 2>&1
          status=$?
          set -e

          cat arch-smoke.log
          if grep -Fq '/usr/lib/x86_64-linux-gnu' arch-smoke.log; then
            echo 'Arch 产物仍在访问 Debian/Ubuntu 的多架构路径' >&2
            exit 1
          fi
          if grep -Eq 'Unable to spawn.*WebKit|SIGTRAP|Traceback \(most recent call last\)' arch-smoke.log; then
            echo 'Arch 产物启动时出现致命错误' >&2
            exit 1
          fi
          # timeout=124 表示 GUI 在冒烟测试结束时仍正常运行；提前退出也应失败。
          if [ "$status" -ne 124 ]; then
            echo "Arch 产物异常退出，status=$status" >&2
            exit 1
          fi

      - name: Prepare source zip for PKGBUILD
        working-directory: packaging/arch
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/dist/EuoraCraft Launcher"
          [ -x "$SRC" ] || { echo "未找到 Arch 原生二进制"; exit 1; }
          mkdir -p srcdist
          cp "$SRC" srcdist/'EuoraCraft Launcher'
          (cd srcdist && zip -rq "$GITHUB_WORKSPACE/packaging/arch/EuoraCraft-Launcher-Arch-X64.zip" 'EuoraCraft Launcher')
          # CI 用本 job 的 Arch 原生产物，把 PKGBUILD 的远程 source 换成本地 zip。
          sed -i 's#^.*EuoraCraft-Launcher-Arch-X64.zip"$#    "EuoraCraft-Launcher-Arch-X64.zip"#' PKGBUILD

      - name: Build package
        working-directory: packaging/arch
        shell: bash
        env:
          PKGVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          sed -i 's#^pkgver=.*#pkgver='"$PKGVER"'#' PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE/packaging/arch"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f -c --noconfirm --skipinteg"

      - name: Upload package as artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            packaging/arch/euoracraft-launcher-*.pkg.tar.zst
            packaging/arch/EuoraCraft-Launcher-Arch-X64.zip
          archive: false

      - name: Upload package to Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packaging/arch
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tagname }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_FILE=$(ls euoracraft-launcher-*.pkg.tar.zst | head -n1)
          echo "uploading $PKG_FILE and Arch binary to $TAG"
          gh release upload "$TAG" "$PKG_FILE" EuoraCraft-Launcher-Arch-X64.zip --clobber
